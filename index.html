<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2b1134">
  <meta name="description" content="Musti'den İremsu'ya, sadece ikimize özel küçük bir aşk operasyonu. 💗">
  <title>İremsu'ma Özel 💗 | Aşk Operasyonu</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%97%3C/text%3E%3C/svg%3E">
  <style>
    :root{color-scheme:dark;--pink:#ff87b5;--light:#ffe2ee;--peach:#ffd8b0;--ink:#381b3a;--gold:#ffe6b7;--muted:#d8b5cc}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-width:310px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#200d2c;color:#fff1f6;min-height:100vh;overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 6% 12%,#a84470 0%,transparent 42%),radial-gradient(circle at 100% 92%,#713d99 0%,transparent 39%),linear-gradient(148deg,#5d234d 0%,#321338 41%,#220d2e 100%)}
    body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.33;background-image:radial-gradient(#ffd4e6 0.6px,transparent 0.6px);background-size:24px 24px;mask-image:linear-gradient(to bottom,transparent,#000 30%,#000 74%,transparent)}
    button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
    .app{width:min(100%,650px);margin:0 auto;padding:18px 18px max(26px,env(safe-area-inset-bottom));position:relative;isolation:isolate}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 23px}.brand{color:#ffd3e4;font-size:.91rem;letter-spacing:.17em;font-weight:850;white-space:nowrap}.brand span{font-size:1.12rem;letter-spacing:0;vertical-align:-1px}.chip{border:1px solid #ffffff42;background:#ffffff0a;color:#f7cbdf;border-radius:99px;font-size:.78rem;padding:10px 14px;white-space:nowrap;font-weight:700}.chip .heart{color:#ff92c2}
    .progress{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin-bottom:21px}.progress>span{height:5px;border-radius:30px;background:#ffffff30;transition:background .4s ease,box-shadow .4s}.progress>span.active{background:linear-gradient(90deg,#ff89b7,#ffbdcf);box-shadow:0 0 12px #ff86b448}
    .panel{position:relative;overflow:hidden;border-radius:39px;border:1.5px solid #f5c8e05e;background:linear-gradient(132deg,#ffffff1e,#ffffff06 39%,#aa66ce40 100%);box-shadow:0 22px 66px #1207165b, inset 0 1px 1px #ffffff26;backdrop-filter:blur(12px)}
    .panel:before{content:"";position:absolute;pointer-events:none;inset:0;background:radial-gradient(circle at 21% 19%,#d56b9a46,transparent 30%),radial-gradient(circle at 80% 95%,#a064e96e,transparent 36%);z-index:-1}
    .content{padding:38px 35px 33px;min-height:clamp(590px,calc(100dvh - 165px),810px);display:flex;flex-direction:column;align-items:center;text-align:center;animation:fade-up .36s ease both}
    @keyframes fade-up{from{opacity:.2;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .eyebrow{font-size:clamp(.67rem,2.4vw,.82rem);letter-spacing:.26em;color:var(--gold);font-weight:850;line-height:1.5;text-transform:uppercase}
    .emoji{font-size:clamp(3.1rem,12vw,4.3rem);margin:35px 0 20px;filter:drop-shadow(0 7px 22px #ffc5ce33);animation:bob 3.5s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    .headline{font-family:Georgia,"Times New Roman",serif;font-size:clamp(2.7rem,9vw,4rem);line-height:1.08;letter-spacing:-.035em;font-style:italic;color:#ffdbed;font-weight:700;margin:0 0 23px;text-wrap:balance;text-shadow:0 2px 19px #2c15266a}
    .description{font-size:clamp(1.08rem,4.3vw,1.35rem);line-height:1.65;color:#f9e3ef;margin:0;max-width:480px;font-weight:520;text-wrap:pretty}
    .description p{margin:0 0 17px}.description strong{color:#ffdae8}.description .soft{color:#ffb7d6}
    .push{flex:1;min-height:28px}.btn,.choice{display:block;width:100%;border-radius:24px;min-height:72px;transition:transform .18s ease,filter .18s ease,background .2s ease}
    .btn:hover,.choice:hover{transform:translateY(-2px)}.btn:active,.choice:active{transform:scale(.985)}
    .btn{padding:17px 18px;border:0;background:linear-gradient(110deg,#ff7bad 0%,#ffb3c9 57%,#ffd3aa 100%);box-shadow:0 14px 34px #f06fa537;color:#3d1c3d;font-weight:850;font-size:clamp(1.05rem,3.8vw,1.3rem)}
    .action-area{width:100%;margin-top:27px}.count{color:#e8c7dd;font-size:1rem;margin-top:16px;font-weight:500}.footnote{padding:22px 0 10px;text-align:center;color:#d2abc5;font-size:.89rem;letter-spacing:.01em}.footnote b{color:#ffd5ea}
    .choices{width:100%;display:grid;gap:13px;margin:16px auto 0}.choice{text-align:left;padding:17px 21px;min-height:74px;border:1.5px solid #ffcadd6a;background:linear-gradient(95deg,#ffffff12,#ffffff22);color:#fff0f6;font-size:clamp(1.02rem,4.2vw,1.24rem);font-weight:750}.choice:hover,.choice:focus-visible{background:#ffffff2a}
    .reply{width:100%;padding:24px 18px;border-radius:23px;background:#ffc5df1a;border:1px solid #ffd8eb70;color:#fff0f6;font-size:1.16rem;line-height:1.6;margin-top:23px}.reply strong{color:#ffd8aa}
    .photo{width:100%;max-width:450px;aspect-ratio:4/3;position:relative;margin:18px auto 3px;border:5px solid #ffe1e6;border-radius:25px;overflow:hidden;background:linear-gradient(135deg,#78345b,#9a579d 55%,#473058);box-shadow:0 12px 35px #11081955;transform:rotate(-1deg)}.photo.tall{aspect-ratio:5/4;transform:rotate(1deg)}.photo img{display:none;width:100%;height:100%;object-fit:cover}.photo.loaded img{display:block}.photo.loaded .placeholder{display:none}.placeholder{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;padding:22px;color:#ffe0ed}.placeholder .camera{font-size:3.2rem}.placeholder .placeholder-note{font-size:.98rem;font-weight:650;line-height:1.6;opacity:.9}
    /* Gerçek fotoğraflardan oluşan kaydırılabilir mini anı albümü */
    .memory{width:100%;max-width:440px;margin:22px auto 5px}
    .memory-counter{display:flex;align-items:center;justify-content:space-between;font-size:.73rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:#ffdbed;margin:0 3px 10px}
    .memory-counter .memory-type{color:var(--gold)}
    .memory-frame{position:relative;width:100%;aspect-ratio:5/6;border:4px solid #ffe0e5e6;border-radius:26px;overflow:hidden;background:#4d263f;box-shadow:0 18px 39px #1a071d69;isolation:isolate;transform:rotate(-.6deg);touch-action:pan-y;}
    .memory-frame.together{transform:rotate(.5deg)}
    .memory-frame::before{content:"";position:absolute;inset:-18px;background:var(--memory-bg) center center / cover no-repeat;filter:blur(22px) brightness(.58) saturate(1.1);z-index:-1}
    .memory-frame img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
    .memory-caption{margin:18px auto 12px;font-size:clamp(.98rem,3.75vw,1.12rem);line-height:1.55;font-weight:650;color:#ffe3ec;min-height:3.2em}
    .memory-nav{display:flex;justify-content:center;align-items:center;gap:17px;margin:2px 0 0}
    .memory-nav button{width:40px;height:40px;border:1px solid #ffbcd877;border-radius:50%;background:#ffffff17;color:#ffe4ed;font-size:1.45rem;display:grid;place-items:center}
    .memory-nav button:disabled{opacity:.27;cursor:default}
    .memory-dots{display:flex;gap:7px;align-items:center;justify-content:center}
    .memory-dots button{padding:0;width:8px;height:8px;border:0;border-radius:100px;background:#ffffff65;transition:width .2s,background .2s}
    .memory-dots button[aria-current="true"]{width:22px;background:linear-gradient(90deg,#ff8bbc,#ffdacd)}
    .photo-text{font-size:clamp(.98rem,3.8vw,1.15rem);line-height:1.6;color:#f5ddec;margin:0 auto 8px;max-width:455px}
    .coupons{width:100%;display:grid;gap:10px;margin:14px 0 4px}.coupon{min-height:60px;border:2px dashed #ffdfb18e;border-radius:19px;padding:13px;color:#ffe8c9;background:#ffffff08;font-size:clamp(.96rem,3.75vw,1.13rem);font-weight:750}.coupon.used{border-style:solid;color:#431a3a;background:linear-gradient(100deg,#ff8fbf,#ffd1b0)}.coupon.used:after{content:" ✓ Kullanıldı"}
    .tiny-note{font-size:.83rem;color:#e9c6d9;line-height:1.5;margin:13px 0 0}
    .backrow{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.back{padding:8px 10px;color:#f7cbdb;border:0;background:transparent;font-size:.88rem}.back:disabled{visibility:hidden}.restart{color:#cca0be;font-size:.8rem;padding:8px 10px;border:0;background:transparent}
    .decor{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:-1}.spark{position:absolute;opacity:.25;animation:floaty var(--speed) linear infinite;font-size:var(--size)}@keyframes floaty{from{transform:translateY(110vh) rotate(0deg)}to{transform:translateY(-14vh) rotate(44deg)}}
    .finale{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(25,6,32,.86);backdrop-filter:blur(13px);text-align:center}.finale.visible{display:flex}.finale-inner{position:relative;z-index:2;width:min(100%,520px);padding:26px 15px}.finale h2{font-family:Georgia,serif;font-style:italic;font-size:clamp(2.5rem,11vw,4.5rem);line-height:1.11;color:#ffe4ef;margin:14px 0}.finale p{line-height:1.6;font-size:1.16rem;color:#ffdae9}.finale .kiss{font-size:3rem;display:block;animation:bob 2.2s ease-in-out infinite}.finale .btn{margin-top:18px}.finale .second{background:transparent;border:1px solid #ffcbd88c;color:#fff1f5;box-shadow:none;min-height:55px;font-size:1rem;margin-top:10px}.finale .small{color:#ecc9d9;font-size:.87rem;min-height:25px}#fireworks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
    @media(max-width:380px){.memory-frame{aspect-ratio:1/1.08}.memory{margin-top:16px}.memory-caption{margin:15px auto 9px}}
    @media(min-width:720px){.app{padding-top:32px}.content{min-height:740px}.panel{border-radius:48px}.topbar{margin-bottom:27px}}
    @media(max-width:380px){.app{padding-inline:12px}.content{padding:32px 23px 26px}.brand{font-size:.75rem}.chip{font-size:.71rem;padding:9px}.headline{font-size:2.55rem}.emoji{margin:26px 0 15px}.description{font-size:1.04rem}.btn{min-height:66px}.choice{min-height:68px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="decor" id="decor" aria-hidden="true"></div>
  <main class="app">
    <header class="topbar"><div class="brand"><span>♥</span> AŞK OPERASYONU</div><div class="chip">Musti <span class="heart">♥</span> İremsu</div></header>
    <div class="progress" id="progress" aria-label="8 aşamalı sürpriz ilerlemesi"></div>
    <section class="panel" aria-live="polite" id="panel"><div class="content" id="content"></div></section>
    <div class="backrow"><button class="back" id="backBtn" type="button">← Önceki aşama</button><button class="restart" id="restartBtn" type="button">↻ Baştan başla</button></div>
    <footer class="footnote">Biraz kahkaha, biraz aşk, <b>bolca biz.</b> ✨</footer>
  </main>
  <div class="finale" id="finale" role="dialog" aria-modal="true" aria-label="İremsu'ya özel final sürprizi">
    <canvas id="fireworks" aria-hidden="true"></canvas>
    <div class="finale-inner">
      <span class="kiss">💗</span>
      <h2>İyi ki benimlesin,<br>İremsu'm.</h2>
      <p>Sen benim en güzel tesadüfüm,<br>en sevdiğim hikâyemsin.<br><strong>Seni çok seviyorum! ❤️</strong></p>
      <button type="button" class="btn" id="songBtn">🎵 Şarkımızı çal</button>
      <p class="small" id="songStatus">Final şarkımızı birlikte ekleyeceğiz ✨</p>
      <button type="button" class="btn second" id="closeFinale">Sürprize geri dön ♡</button>
    </div>
  </div>
  <audio id="song" preload="none" src="assets/sarkimiz.mp3"></audio>
  <script>
  (() => {
    'use strict';
    const $ = id => document.getElementById(id);
    const content=$('content'), progress=$('progress'), backBtn=$('backBtn'), song=$('song');
    let stage=0, substage='', chosen='', isPlaying=false, fireAnim=0, particles=[], fireUntil=0, lastBurst=0;
    const coupons=[false,false,false];
    const albumIndex={5:0,6:0};
    const albums={
      5:[
        {src:'assets/photo-1.webp',alt:'İremsu, kafenin masasında iki minik ördek figürüyle',caption:'İki minik ördek, bir kocaman gülümseme… Böyle baktığında dünya güzelleşiyor. 🐥💗'},
        {src:'assets/photo-2.webp',alt:'İremsu, pencere önündeki koltukta gülümsüyor',caption:'Bu fotoğrafa her baktığımda yine aynı şeyi düşünüyorum: Çok güzelsin. 🤍'},
        {src:'assets/photo-3.webp',alt:'İremsu, pencere kenarındaki koltukta oturuyor',caption:'Bazen sadece bir fotoğrafına bakıp gülümsüyorum. Bunun sebebi sensin. 🥹❤️'}
      ],
      6:[
        {src:'assets/photo-4.webp',alt:'Musti ve İremsu kafede birlikte selfie çekiyor',caption:'Bir kahve, biraz tatlı ve sen… En güzel anıların tarifi bu olabilir. ☕🍰'},
        {src:'assets/photo-5.webp',alt:'İremsu ile birlikte dışarıda çekilen bir anı fotoğrafı',caption:'Sıradan bir akşamın bile seninle ne kadar özel olabildiğinin kanıtı. ✨'},
        {src:'assets/photo-6.webp',alt:'Musti ve İremsu birlikte bir davette',caption:'Yan yana olduğumuz her kare, biriktirmek istediğim yeni bir hatıra. 💞'},
        {src:'assets/photo-7.webp',alt:'Musti ve İremsu şakalaşırken yakın çekim fotoğraf',caption:'Biraz ciddi, biraz şımarık… İşte tam da bizim hâlimiz! 😄💋'},
        {src:'assets/photo-8.webp',alt:'Musti ve İremsu tuğla duvar önünde birlikte selfie çekiyor',caption:'Daha fotoğrafa bakarken bile yüzümde bir gülümseme… İyi ki biz. 🌿❤️'}
      ]
    };
    const titles=[
      'GİZLİ GÖREV · 01','AŞAMA 02 · BİLGİLENDİRME','AŞAMA 03 · DUYGU ANALİZİ','AŞAMA 04 · İTİRAF',
      'AŞAMA 05 · ZOR SEÇİM','AŞAMA 06 · FOTOĞRAF KANITI','AŞAMA 07 · BİZİM ANIMIZ','AŞAMA 08 · FİNAL'
    ];
    const button=(id,label)=>`<button class="btn" id="${id}" type="button">${label}</button>`;
    function screen(emoji,heading,description,footer,extra=''){
      return `<div class="eyebrow">${titles[stage]}</div><div class="emoji" aria-hidden="true">${emoji}</div><h1 class="headline">${heading}</h1><div class="description">${description}</div>${extra}<div class="push"></div>${footer?`<div class="action-area">${footer}</div>`:''}<div class="count">${stage+1} / 8</div>`;
    }
    function go(next){ stage=Math.max(0,Math.min(7,next)); substage='';chosen='';render();window.scrollTo(0,0); }
    function bind(id,handler){const el=$(id);if(el)el.addEventListener('click',handler)}
    function render(){
      progress.innerHTML=Array.from({length:8},(_,i)=>`<span class="${i<=stage?'active':''}" aria-hidden="true"></span>`).join('');
      progress.setAttribute('aria-label',`${stage+1} / 8`);
      let markup='';
      switch(stage){
        case 0:markup=screen('💌','İremsu’m, hoş geldin!', '<p>Bugün dünyanın en tatlı insanı için küçük bir operasyon başlatıldı.</p><p>Şüpheli: <strong>Musti.</strong><br>Suçu: <strong>Sana her geçen gün daha çok âşık olmak.</strong> 🤭</p>',button('next','Operasyonu başlat 💗'));break;
        case 1:markup=screen('🥹','Önemli bir duyuru!','<p>Bu sayfayı açtığın için hesabına <strong>sonsuz sarılma, bolca öpücük ve sınırsız şımartılma hakkı</strong> tanımlandı.</p><p>İtirazlar kabul edilmiyor. Sadece daha fazla sarılma talebi alınır. 😌❤️</p>',button('next','Haklarımı kabul ediyorum'));break;
        case 2:
          if(!substage)markup=screen('😏','Dürüst ol bakalım…','<p>Şu an bu uygulamayı hazırlayan kişiyi ne kadar özlüyorsun?</p>','',`<div class="choices"><button class="choice" data-answer="1">Aşırı özledim ❤️</button><button class="choice" data-answer="2">Birazcık 🙄</button><button class="choice" data-answer="3">Söylemem, şımarır 😈</button></div>`);
          else markup=screen('💞','Ben de seni!',`<p>${chosen}</p>`,button('next','Bakalım sırada ne var 💕'));break;
        case 3:markup=screen('🥰','Bir itirafım var…','<p>Bazen sana bakınca söyleyecek cümle bulamıyorum. Sonra düşünüyorum: Ben nasıl bu kadar güzel bir kalbe denk geldim?</p><p>İyi ki denk gelmişiz. <strong>İyi ki sen.</strong> ❤️</p>',button('next','Ay, devam et bakalım'));break;
        case 4:
          if(!substage)markup=screen('💋','Şimdi seçim zamanı!','<p>Şu an yanında olsaydım önce hangisini isterdin?</p>','',`<div class="choices"><button class="choice" data-answer="1">Sıcacık, uzun bir sarılma 🫂</button><button class="choice" data-answer="2">Kocaman bir öpücük 💋</button><button class="choice" data-answer="3">İkisi de, soru mu bu? ❤️</button></div>`);
          else markup=screen('🥹','Hemen geliyorum!','<p>'+chosen+'</p>',button('next','Bir anımıza bakalım 📸'));break;
        case 5:markup=screen('📸','En sevdiğim karelerden…','<p>Senin her fotoğrafında ayrı bir güzellik var. Ama en çok da bende uyandırdığın hisleri seviyorum. 💗</p>',button('albumNext',albumIndex[5]===albums[5].length-1?'Bizim anılarımıza geç 💞':'Bir fotoğraf daha göster 📷'),memoryAlbum(5));break;
        case 6:markup=screen('🫶','Bir de bizim hikâyemiz…','<p>En güzel fotoğraflar kusursuz çıktıklarımız değil, birlikte olduğumuzu hatırlatanlar.</p>',button('albumNext',albumIndex[6]===albums[6].length-1?'Finale hazırım ✨':'Bir anı daha göster 💕'),memoryAlbum(6));break;
        case 7:markup=screen('💝','İyi ki benimlesin, İremsu’m.','<p>Seninle gülmek, saçmalamak ve bazen sadece yan yana olmak… Hepsi benim için çok kıymetli.</p><p><strong>İyi ki yollarımız kesişmiş. İyi ki sen.</strong></p>','',`<div class="coupons">${['🫂 Sınırsız sarılma kuponu','💋 Kocaman öpücük kuponu','🍫 Seni şımartma günü kuponu'].map((c,i)=>`<button class="coupon ${coupons[i]?'used':''}" data-coupon="${i}" type="button">${c}</button>`).join('')}</div><p class="tiny-note">Kuponları kullanmak için dokun. Hepsi sınırsız sevgiyle geçerli. ♡</p><div class="action-area">${button('finalBtn','Son sürprizi aç 🎁❤️')}</div>`);break;
      }
      content.innerHTML=markup;
      $('panel').scrollTop=0; $('panel').scrollLeft=0;
      backBtn.disabled=stage===0;
      bind('next',()=>go(stage+1));
      bind('albumNext',()=>advanceAlbum());
      bind('albumPrev',()=>changeAlbum(-1));
      bind('albumForward',()=>changeAlbum(1));
      document.querySelectorAll('[data-album-dot]').forEach(el=>el.addEventListener('click',()=>{albumIndex[stage]=Number(el.dataset.albumDot);render();}));
      const memoryFrame=$('memoryFrame');
      if(memoryFrame){
        let swipeStartX=null,swipeStartY=null;
        memoryFrame.addEventListener('touchstart',e=>{swipeStartX=e.touches[0].clientX;swipeStartY=e.touches[0].clientY},{passive:true});
        memoryFrame.addEventListener('touchend',e=>{if(swipeStartX===null)return;const dx=e.changedTouches[0].clientX-swipeStartX,dy=e.changedTouches[0].clientY-swipeStartY;if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)*1.25)changeAlbum(dx<0?1:-1);swipeStartX=null;},{passive:true});
      }
      document.querySelectorAll('[data-answer]').forEach(el=>el.addEventListener('click',()=>{
        const n=Number(el.dataset.answer);
        if(stage===2)chosen=['','Ben de seni çok özledim. Keşke şimdi yanımda olsan, hiç bırakmasam. 🥹❤️','Birazcık mı? Ben senin yerine de özledim o zaman. 😌','Şımarırım tabii! Çünkü senden gelen her şey çok güzel. 😏💗'][n];
        if(stage===4)chosen=['','O sarılmanın bitmesini hiç istemem. 🫂','Bir tane değil, milyon tane! 💋','İşte beklediğim doğru cevap! Hem sarılma hem öpücük, hem de bonus sevgi. ❤️'][n];
        substage='answered';render();
      }));
      document.querySelectorAll('[data-coupon]').forEach(el=>el.addEventListener('click',()=>{const i=Number(el.dataset.coupon);coupons[i]=!coupons[i];render()}));
      bind('finalBtn',openFinale);
      document.querySelectorAll('.photo img').forEach(img=>{
        img.addEventListener('load',()=>img.closest('.photo').classList.add('loaded'));
        img.addEventListener('error',()=>img.closest('.photo').classList.remove('loaded'));
        if(img.complete && img.naturalWidth)img.closest('.photo').classList.add('loaded');
      });
    }
    function changeAlbum(delta){
      const images=albums[stage];if(!images)return;
      const next=Math.max(0,Math.min(images.length-1,albumIndex[stage]+delta));
      if(next!==albumIndex[stage]){albumIndex[stage]=next;render();}
    }
    function advanceAlbum(){
      if(!albums[stage])return;
      if(albumIndex[stage]<albums[stage].length-1)changeAlbum(1);
      else go(stage+1);
    }
    function memoryAlbum(which){
      const images=albums[which],idx=albumIndex[which],item=images[idx];
      return `<div class="memory" aria-label="Fotoğraf albümü">
        <div class="memory-counter"><span class="memory-type">${which===5?'İREMSU’MUN GÜZEL KARELERİ':'BİZİM KÜÇÜK HİKÂYEMİZ'}</span><span>${idx+1} / ${images.length}</span></div>
        <div class="memory-frame ${which===6?'together':''}" id="memoryFrame" style="--memory-bg:url('${item.src}')"><img src="${item.src}" alt="${item.alt}" draggable="false" decoding="async"></div>
        <p class="memory-caption">${item.caption}</p>
        <div class="memory-nav"><button id="albumPrev" aria-label="Önceki fotoğraf" ${idx===0?'disabled':''}>‹</button><div class="memory-dots">${images.map((_,i)=>`<button aria-label="${i+1}. fotoğraf" aria-current="${idx===i}" data-album-dot="${i}"></button>`).join('')}</div><button id="albumForward" aria-label="Sonraki fotoğraf" ${idx===images.length-1?'disabled':''}>›</button></div>
        <div class="tiny-note">Fotoğrafları sağa sola kaydırabilirsin ♡</div>
      </div>`;
    }
    function photo(src,alt,placeholder,extra=''){
      return `<div class="photo ${extra}"><img src="${src}" alt="${alt}" loading="lazy"><div class="placeholder"><span class="camera">📷</span><span class="placeholder-note">${placeholder}</span></div></div>`;
    }
    backBtn.addEventListener('click',()=>{if(substage){substage='';render()}else if(stage>0)go(stage-1)});
    $('restartBtn').addEventListener('click',()=>{coupons.fill(false);albumIndex[5]=0;albumIndex[6]=0;go(0)});
    function openFinale(){ $('finale').classList.add('visible');document.body.style.overflow='hidden';startFireworks();$('songBtn').focus(); }
    $('closeFinale').addEventListener('click',()=>{$('finale').classList.remove('visible');document.body.style.overflow='';stopFireworks();});
    $('songBtn').addEventListener('click',async()=>{
      if(isPlaying){song.pause();isPlaying=false;$('songBtn').textContent='🎵 Şarkımızı çal';$('songStatus').textContent='Yine açmak için dokun ♡';return;}
      try{await song.play();isPlaying=true;$('songBtn').textContent='⏸ Şarkıyı durdur';$('songStatus').textContent='Bu şarkı ikimizin… 💗';}
      catch(e){$('songStatus').textContent='Şarkımızı eklediğimizde burada çalacak. 🎶';}
    });
    song.addEventListener('ended',()=>{isPlaying=false;$('songBtn').textContent='🎵 Yeniden çal'});
    // Animasyon arka planı. Dış kütüphane / sunucu gerektirmez.
    const decoration=['♥','✧','✦','♡','✿'];
    const dec=$('decor');for(let i=0;i<17;i++){
      const s=document.createElement('span');s.className='spark';s.textContent=decoration[i%decoration.length];
      s.style.left=(3+i*17%94)+'%';s.style.setProperty('--size',(12+i*3%17)+'px');s.style.setProperty('--speed',(16+i*7%17)+'s');s.style.animationDelay=-(i*2.1)+'s';dec.appendChild(s);
    }
    const canvas=$('fireworks'),ctx=canvas.getContext('2d');
    const colors=['#ff84b9','#ffd6a4','#ffe7ed','#cfb5ff','#fffbc8'];
    function resizeCanvas(){let d=Math.min(window.devicePixelRatio||1,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0)}
    function burst(x,y){for(let i=0;i<44;i++){const a=Math.random()*Math.PI*2,v=2.0+Math.random()*4.8;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:70+Math.random()*20,r:1.5+Math.random()*2,color:colors[Math.floor(Math.random()*colors.length)]})}}
    function frame(time){ctx.clearRect(0,0,innerWidth,innerHeight);if(time<fireUntil && time-lastBurst>650){lastBurst=time;burst(innerWidth*(.15+Math.random()*.7),innerHeight*(.19+Math.random()*.49))}
      for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.038;p.vx*=.988;p.life-=1;ctx.globalAlpha=Math.max(0,Math.min(1,p.life/65));ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();if(p.life<=0)particles.splice(i,1)}ctx.globalAlpha=1;
      if(time<fireUntil||particles.length){fireAnim=requestAnimationFrame(frame)}else fireAnim=0;}
    function startFireworks(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;resizeCanvas();particles=[];lastBurst=0;fireUntil=performance.now()+6100;if(fireAnim)cancelAnimationFrame(fireAnim);fireAnim=requestAnimationFrame(frame)}
    function stopFireworks(){if(fireAnim)cancelAnimationFrame(fireAnim);fireAnim=0;particles=[];ctx.clearRect(0,0,canvas.width,canvas.height)}
    window.addEventListener('resize',()=>{if($('finale').classList.contains('visible'))resizeCanvas()});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('finale').classList.contains('visible'))$('closeFinale').click()});
    render();
  })();
  </script>
</body>
</html>
